<div class="chat-shell">
  <div class="chat-shell__sidebar">
    <ng-container
      [ngTemplateOutlet]="conversationSidebar"
      [ngTemplateOutletContext]="{ closeAfterAction: false }"
    />
  </div>

  <main class="chat-shell__main">
    <header class="chat-shell__topbar">
      <button
        class="chat-shell__menu"
        nz-button
        nzType="text"
        type="button"
        aria-label="Open conversations"
        (click)="openMobileSidebar()"
      >
        <nz-icon nzType="menu" />
      </button>
      <div>
        <strong>{{ activeConversation()?.title ?? 'New chat' }}</strong>
        <span>ChatGPT 5.6 Sol · Medium</span>
      </div>
    </header>

    <chat-conversation
      [conversation]="activeConversation()"
      [actionsDisabled]="false"
      (suggestedActionSelected)="onMessageSubmitted($event)"
    />

    <footer class="chat-shell__composer">
      <chat-composer (submitted)="onMessageSubmitted($event)" />
      <p>
        Interactive Story can make mistakes. Review each path before choosing.
      </p>
    </footer>
  </main>
</div>

<nz-drawer
  nzPlacement="left"
  [nzClosable]="false"
  [nzWidth]="320"
  [nzVisible]="mobileSidebarOpen()"
  (nzOnClose)="closeMobileSidebar()"
>
  <ng-container *nzDrawerContent>
    <ng-container
      [ngTemplateOutlet]="conversationSidebar"
      [ngTemplateOutletContext]="{ closeAfterAction: true }"
    />
  </ng-container>
</nz-drawer>

<ng-template #conversationSidebar let-closeAfterAction="closeAfterAction">
  <chat-conversation-sidebar
    [sections]="sidebarSections()"
    [activeConversationId]="activeConversationId()"
    (newConversation)="
      onNewConversation(); closeAfterAction ? closeMobileSidebar() : undefined
    "
    (activeConversationIdChange)="
      onConversationIdSelected($event, closeAfterAction)
    "
    (searchQueryChange)="onSearchQueryChanged($event)"
  />
</ng-template>
