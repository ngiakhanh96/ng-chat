<form class="composer" (submit)="onSubmit($event)">
  <span class="composer__hub" aria-hidden="true"></span>

  <div class="composer__field">
    <button
      class="composer__icon-button"
      nz-button
      nzType="text"
      type="button"
      nz-tooltip
      nzTooltipTitle="Attach file"
      aria-label="Attach file"
    >
      <nz-icon nzType="paper-clip" />
    </button>

    <textarea
      #messageInput
      class="composer__textarea"
      nz-input
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="5"
      [placeholder]="placeholder()"
      [formField]="composerForm.message"
      (keydown)="onKeydown($event)"
      aria-label="Message"
    ></textarea>
  </div>

  <button
    class="composer__send"
    nz-button
    nzType="primary"
    type="submit"
    [disabled]="!canSend()"
    aria-label="Send message"
  >
    <nz-icon nzType="send" />
  </button>
</form>
