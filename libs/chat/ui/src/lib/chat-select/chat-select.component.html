<div class="chat-select" [class.chat-select--indicator]="indicator()">
  <select
    [attr.aria-label]="label()"
    [value]="value()"
    (change)="onValueChanged($event)"
  >
    @for (option of options(); track option.id) {
      <option [value]="option.id">{{ option.name }}</option>
    }
  </select>
</div>
